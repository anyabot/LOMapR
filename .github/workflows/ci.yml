name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, new-dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The lockfile records game-hub as git+ssh; this runner has no SSH key.
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      # Same game-hub revision the deploy build picks up.
      - run: npm run hub:update
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

